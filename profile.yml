banner:
  hud: true                           # arcade header: 1UP, HI-SCORE (contributions in the last year) and REPOS; false hides it
  avatar: assets/source/avatar.png   # drop your avatar here (square, plain background) and it replaces your name on the LED board
  words: [TS, REACT, NODE, SQL]      # the LED dots turn into these (A-Z, 0-9, up to 6 letters)
  file_comment:
    en: "# this file builds the whole profile"
    es: "# de este archivo sale todo el perfil"
  # The line starts with a phrase of 36 characters or fewer followed by spaces: that is
  # what stays visible when the line stops scrolling (and for people who turn motion off).
  marquee:
    en: "FREELANCE, INTERNSHIPS, JUNIOR ROLES      ★      BASED IN LIMA, PERU (UTC-5)      ★      "
    es: "FREELANCE, PRÁCTICAS, PUESTOS JUNIOR      ★      DESDE LIMA, PERÚ (UTC-5)      ★      "

