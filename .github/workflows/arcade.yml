name: Arcade games

on:
  schedule:
    - cron: "30 10 * * *"   # 05:30 in Lima, after the profile build
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.yml
      - .github/workflows/arcade.yml

permissions:
  contents: write

concurrency:
  group: arcade
  cancel-in-progress: true

jobs:
  arcade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read the game list from profile.yml
        id: games
        run: |
          games=$(sed -n 's/^ *games: *\[\(.*\)\].*/\1/p' profile.yml | tr -d ' ')
          echo "list=${games:-pacman,bomberman}" >> "$GITHUB_OUTPUT"

      # Third-party action, pinned to a release so an upstream change cannot break the profile.
      - name: Play the contribution graph
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: ${{ steps.games.outputs.list }}

      - name: Publish the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
